name: Bug report
description: Something in a Terra Nauvis world is broken or looks wrong
labels: ["type: bug", "priority: med"]
body:
  - type: markdown
    attributes:
      value: |
        A world generation bug can only be found again with the same map, scale, spawn city and seed, so the
        fields below ask for them. Type `/seed` in the game's chat to print the map seed.
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: The Terra Nauvis version shown in the Mods menu.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: factorio-version
    attributes:
      label: Factorio version
      description: Shown at the bottom left of the main menu. Say if Space Age is enabled.
      placeholder: "2.1.24, base game only"
    validations:
      required: true
  - type: dropdown
    id: map-preset
    attributes:
      label: Map preset
      description: The preset the world was created from.
      options:
        - "Terra Nauvis: Europe"
        - "Terra Nauvis: Atlantic"
        - "Terra Nauvis: Old World"
        - A Terra Nauvis map type picked in the Terrain tab, without the preset
        - Not a Terra Nauvis world
    validations:
      required: true
  - type: dropdown
    id: map-scale
    attributes:
      label: Map scale
      description: The Map scale setting when the world was created.
      options:
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "6"
        - "12"
        - "24"
    validations:
      required: true
  - type: input
    id: spawn-city
    attributes:
      label: Spawn city
      description: The city you chose. For Random, give the city the start message named.
      placeholder: "Frankfurt"
    validations:
      required: true
  - type: input
    id: map-seed
    attributes:
      label: Map seed
      description: Type /seed in the game's chat.
      placeholder: "1000"
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Mod settings you changed
      description: Any Terra Nauvis startup setting that is not at its default, such as Destroyed Europe on or North snow High.
    validations:
      required: false
  - type: textarea
    id: other-mods
    attributes:
      label: Other mods
      description: List the other enabled mods with their versions, or write "none". Alien Biomes, Cargo Ships and RSO matter most.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and where. A map position (hover the map and read the coordinates) helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: For a crash or an error message, paste the lines round the error from factorio-current.log in the game's user data folder.
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here. For a terrain bug, one shot of the map view and one in the world are best.
    validations:
      required: false
